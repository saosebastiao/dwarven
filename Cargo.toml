[package]
name = "dwarven"
version = "0.0.1"
edition = "2024"
description = "Host-agnostic system for specification-driven software development with strongly decoupled agents and a local coordination hub"
license = "MIT"
repository = "https://github.com/danieltoone/dwarven"
readme = "README.md"

[[bin]]
name = "dwarven"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
nix = { version = "0.29", features = ["signal"] }
notify = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
signal-hook = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "0.8"
toml_edit = "0.22"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3.10"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = "thin"
strip = true
