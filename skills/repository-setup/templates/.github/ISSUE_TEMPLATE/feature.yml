name: Feature
description: Implementation work derived from a spec requirement.
title: "Implement: "
labels: ["type:feature", "agent:pm"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template when filing implementation work. PM (`/pm`) will decompose into Planning-sized children if needed.
  - type: input
    id: spec-ref
    attributes:
      label: Related spec requirement(s)
      description: Cite R<n> from `docs/specs/*.md`
      placeholder: "R3.5, R3.7"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What should be implemented
      description: Describe the desired behavior. PM will decompose this if necessary.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Explicitly out of scope (optional)
      description: Anything that should NOT be done as part of this work.
